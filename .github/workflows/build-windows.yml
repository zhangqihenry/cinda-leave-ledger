name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable EXE
        run: npm run desktop:build:windows

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: leave-ledger-windows-x64
          path: src-tauri/target/release/cinda-leave-ledger.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "src-tauri/target/release/cinda-leave-ledger.exe#Cinda Leave Ledger Windows x64 免安装版"
          --verify-tag
          --notes "小调整及小修复。"
          --latest
