services:
  leave-ledger:
    container_name: leave-ledger
    image: ghcr.io/zhangqihenry/cinda-leave-ledger:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATA_DIR: "/data"
      TZ: "Asia/Hong_Kong"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin1234}"
      RESET_PASSWORD: "${RESET_PASSWORD:-Abcd1234!}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    volumes:
      - leave-ledger-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  leave-ledger-data:
